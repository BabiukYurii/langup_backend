<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LangUp — Playlist</title>
    <link rel="stylesheet" href="styles.css?v=dev" />
  </head>
  <body>
    <main class="shell shell--narrow">
      <section class="app">
        <nav class="topbar">
          <a href="index.html" class="brand">
            <span class="brand__logo">L</span>
            <span class="brand__name">LangUp</span>
          </a>
          <div class="topbar__nav">
            <a href="dashboard.html" class="topbar__link" data-i18n="nav.dashboard">Dashboard</a>
            <a href="review.html" class="topbar__link" data-i18n="nav.review">Review</a>
            <a href="words.html" class="topbar__link" data-i18n="nav.dictionary">Dictionary</a>
            <a href="practice.html" class="topbar__link" data-i18n="nav.practice">Practice</a>
            <a href="playlist.html" class="topbar__link is-active" data-i18n="nav.songs">Songs</a>
          </div>
        </nav>

        <div class="hero">
          <h1 class="hero__title" data-i18n="playlist.title">Understand your playlist</h1>
          <p class="hero__subtitle" data-i18n="playlist.subtitle">Paste a Spotify playlist link to see which words you already know.</p>
        </div>

        <!-- import -->
        <div id="import-bar">
          <div class="admin__listbar">
            <input id="pl-url" class="dict__search" type="text" data-i18n-placeholder="playlist.url_ph" placeholder="Spotify playlist link…" />
            <button id="pl-import" class="btn btn--primary" type="button" data-i18n="playlist.import">Import</button>
          </div>
          <div id="pl-progress" class="progress progress--indeterminate hidden"><div></div></div>
          <p id="pl-status" class="meta"></p>
        </div>

        <!-- saved playlists -->
        <div id="playlists-view">
          <h2 class="card__title" data-i18n="playlist.my_playlists">My playlists</h2>
          <ul id="playlists-list" class="dict__list"></ul>
          <p id="playlists-empty" class="meta hidden" data-i18n="playlist.empty_playlists">No playlists yet — import one above.</p>
        </div>

        <!-- one playlist's songs -->
        <section id="songs-view" class="card hidden">
          <div class="words-bar">
            <button id="sv-back" class="btn btn--ghost" type="button" data-i18n="playlist.back_playlists">← Playlists</button>
            <div class="dict__head">
              <h2 id="sv-name" class="card__title">—</h2>
            </div>
          </div>
          <input id="songs-search" class="dict__search" type="text" data-i18n-placeholder="playlist.song_search_ph" placeholder="Search a song…" />
          <ul id="songs-list" class="dict__list"></ul>
          <p id="songs-empty" class="meta hidden" data-i18n="playlist.no_songs">No songs.</p>
        </section>

        <!-- lyrics -->
        <section id="lyrics-view" class="card hidden">
          <div class="words-bar">
            <button id="ly-back" class="btn btn--ghost" type="button" data-i18n="playlist.back_songs">← Songs</button>
            <div class="dict__head">
              <h2 id="ly-title" class="card__title">—</h2>
              <span id="ly-artist" class="meta"></span>
            </div>
          </div>
          <div class="lyrics-legend">
            <span><i class="dot dot--known"></i><span data-i18n="playlist.legend_known">Known</span></span>
            <span><i class="dot dot--learning"></i><span data-i18n="playlist.legend_learning">Learning</span></span>
            <span><i class="dot dot--unknown"></i><span data-i18n="playlist.legend_unknown">New</span></span>
          </div>
          <p id="ly-status" class="meta"></p>
          <div id="lyrics-body" class="lyrics"></div>
        </section>
      </section>

      <div id="toast" class="toast hidden"></div>
    </main>

    <script src="config.js?v=dev"></script>
    <script src="i18n.js?v=dev"></script>
    <script src="api.js?v=dev"></script>
    <script src="playlist.js?v=dev"></script>
  </body>
</html>
