<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LangUp — Playlist</title>
    <link rel="stylesheet" href="styles.css?v=dev" />
  </head>
  <body>
    <main class="shell shell--narrow">
      <section class="app">
        <nav class="topbar">
          <a href="index.html" class="brand">
            <span class="brand__logo">L</span>
            <span class="brand__name">LangUp</span>
          </a>
          <div class="topbar__nav">
            <a href="dashboard.html" class="topbar__link" data-i18n="nav.dashboard">Dashboard</a>
            <a href="review.html" class="topbar__link" data-i18n="nav.review">Review</a>
            <a href="words.html" class="topbar__link" data-i18n="nav.dictionary">Dictionary</a>
            <a href="practice.html" class="topbar__link" data-i18n="nav.practice">Practice</a>
            <a href="playlist.html" class="topbar__link is-active" data-i18n="nav.songs">Songs</a>
          </div>
        </nav>

        <div class="hero">
          <h1 class="hero__title" data-i18n="playlist.title">Understand your playlist</h1>
          <p class="hero__subtitle" data-i18n="playlist.subtitle">Paste a Spotify playlist link to see which words you already know.</p>
        </div>

        <!-- URL input -->
        <div id="url-bar" class="admin__listbar">
          <input id="pl-url" class="dict__search" type="text" data-i18n-placeholder="playlist.url_ph" placeholder="Spotify playlist link…" />
          <button id="pl-load" class="btn btn--primary" type="button" data-i18n="playlist.load">Load</button>
        </div>
        <p id="pl-warning" class="notice hidden"></p>
        <p id="pl-status" class="meta"></p>

        <!-- tracks -->
        <div id="tracks-view">
          <h2 id="pl-name" class="card__title hidden"></h2>
          <ul id="tracks-list" class="dict__list"></ul>
        </div>

        <!-- lyrics -->
        <section id="lyrics-view" class="card hidden">
          <div class="words-bar">
            <button id="ly-back" class="btn btn--ghost" type="button" data-i18n="playlist.back_tracks">← Tracks</button>
            <div class="dict__head">
              <h2 id="ly-title" class="card__title">—</h2>
              <span id="ly-artist" class="meta"></span>
            </div>
          </div>
          <div class="lyrics-legend">
            <span><i class="dot dot--known"></i><span data-i18n="playlist.legend_known">Known</span></span>
            <span><i class="dot dot--unknown"></i><span data-i18n="playlist.legend_unknown">New</span></span>
          </div>
          <p id="ly-status" class="meta"></p>
          <div id="lyrics-body" class="lyrics"></div>
        </section>
      </section>

      <div id="toast" class="toast hidden"></div>
    </main>

    <script src="config.js?v=dev"></script>
    <script src="i18n.js?v=dev"></script>
    <script src="api.js?v=dev"></script>
    <script src="playlist.js?v=dev"></script>
  </body>
</html>
