<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LangUp — Dictionary</title>
    <link rel="stylesheet" href="styles.css?v=dev" />
  </head>
  <body>
    <main class="shell">
      <header class="brand">
        <span class="brand__logo">L</span>
        <span class="brand__name">LangUp</span>
      </header>

      <section class="card">
        <div class="words-bar">
          <a href="index.html" class="btn btn--ghost">← Profile</a>
          <div class="dict__head">
            <h1 class="card__title">Dictionary</h1>
            <span id="dict-count" class="meta"></span>
          </div>
        </div>

        <input id="dict-search" class="dict__search" type="text" placeholder="Search a word…" />
        <ul id="dict-list" class="dict__list"></ul>
        <p id="dict-empty" class="meta hidden">Empty for now — save your first word with the extension.</p>
      </section>
    </main>

    <script src="config.js?v=dev"></script>
    <script src="api.js?v=dev"></script>
    <script src="words.js?v=dev"></script>
  </body>
</html>
