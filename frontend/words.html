<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LangUp — Dictionary</title>
    <link rel="stylesheet" href="styles.css?v=dev" />
  </head>
  <body>
    <main class="shell shell--narrow">
      <header class="brand">
        <span class="brand__logo">L</span>
        <span class="brand__name">LangUp</span>
      </header>

      <section class="card">
        <div class="words-bar">
          <a href="index.html" class="btn btn--ghost">← Profile</a>
          <div class="dict__head">
            <h1 class="card__title">Dictionary</h1>
            <span id="dict-count" class="meta"></span>
          </div>
        </div>

        <input id="dict-search" class="dict__search" type="text" placeholder="Search a word…" />
        <ul id="dict-list" class="dict__list"></ul>
        <p id="dict-empty" class="meta hidden">Empty for now — save your first word with the extension.</p>
      </section>

      <!-- word detail -->
      <div id="word-modal" class="modal hidden">
        <div class="modal__backdrop" data-close></div>
        <div class="modal__card card">
          <button class="modal__close" data-close aria-label="Close">×</button>
          <div class="modal__head">
            <h2 id="wd-lemma" class="card__title">—</h2>
            <span id="wd-lang" class="badge badge--muted">—</span>
            <span id="wd-mastery" class="badge">new</span>
          </div>
          <p id="wd-translation" class="wd__translation">—</p>

          <h3 class="wd__subhead">Where you saw it</h3>
          <ul id="wd-context-list" class="wd__contexts"></ul>
          <p id="wd-no-context" class="meta hidden">No saved sentences yet.</p>

          <div class="modal__actions">
            <button id="wd-remove" class="btn btn--danger" type="button">Remove from dictionary</button>
          </div>
        </div>
      </div>

      <div id="toast" class="toast hidden"></div>
    </main>

    <script src="config.js?v=dev"></script>
    <script src="api.js?v=dev"></script>
    <script src="words.js?v=dev"></script>
  </body>
</html>
