---
# Local/dev orchestration. Production deploys via the k8s/ manifests.
services:
  app:
    build:
      context: .
    image: langup-app
    container_name: langup-api
    env_file: [.env]
    # Serve the cabinet from disk so UI changes need only a file swap
    # (StaticFiles reads per request) — no image rebuild.
    volumes:
      - ./frontend:/app/frontend:ro
      # The Flutter web build, when there is one. Building it needs the Flutter
      # SDK, which does not belong in this image, so the artifact is produced
      # elsewhere and copied here:
      #   cd langup_mobile
      #   flutter build web --release --base-href=/app/ --dart-define=API_BASE_URL=/api
      #   rsync -a --delete build/web/ <server>:~/Desktop/apps/langup_backend/webapp/
      #
      # Replace the CONTENTS, never the directory. A bind mount is bound to the
      # inode, so `rm -rf webapp && mkdir webapp` leaves the container looking
      # at the deleted one — the files are on the host, /app/webapp is empty,
      # and every request 500s until the container is recreated. rsync --delete
      # above is safe precisely because it clears the contents in place.
      #
      # The app is served the moment this directory holds an index.html, and the
      # original HTML cabinet comes back the moment it does not — no code change
      # either way. Empty by default, so nothing changes until it is filled.
      #
      # Assets are then served under /app/v/<hash of main.dart.js>/, so a new
      # build is a new URL and no cache — browser or Cloudflare — can answer it
      # with the old one. Nothing to purge after a deploy.
      - ./webapp:/app/webapp:ro
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # named "db" to match every other project on the server (backup.py looks for it)
  db:
    image: postgres:17-alpine
    container_name: langup-db
    env_file: [.env]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "${POSTGRES_DB}", "-U", "${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: langup-redis
    env_file: [.env]
    entrypoint: ["sh", "/entrypoint.sh"]
    volumes:
      - ./redis/entrypoint.sh:/entrypoint.sh:ro
      - redisdata:/data
    # Loading the append-only file takes a moment, during which connections are
    # refused — so dependants wait for a real PING, not just for the container.
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # MinIO: S3-compatible object storage for TTS audio and exports.
  minio:
    image: minio/minio:latest
    container_name: langup-minio
    env_file: [.env]
    command: server /data --console-address ":9001"
    ports: ["9000:9000", "9001:9001"]
    volumes:
      - miniodata:/data
    restart: unless-stopped

  celery_worker:
    image: langup-app
    container_name: langup-celery-worker
    env_file: [.env]
    # One slot on purpose: Ollama serves a single inference at a time, so extra
    # workers would only make jobs fight over the same cores.
    entrypoint:
      ["uv", "run", "celery", "-A", "app.celery.config:celery_app", "worker", "--loglevel=info", "--concurrency=1"]
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
    restart: unless-stopped

  # Warming rides in its own worker on its own queue, so a song nobody has
  # opened yet can never sit in front of a learner's exercise refill. Both
  # workers still share one model — that contention is settled in Redis, see
  # services/learning/model_busy.
  celery_warm:
    image: langup-app
    container_name: langup-celery-warm
    env_file: [.env]
    entrypoint:
      ["uv", "run", "celery", "-A", "app.celery.config:celery_app", "worker",
       "--loglevel=info", "--concurrency=1", "--queues=warm"]
    depends_on:
      redis: { condition: service_healthy }
      db: { condition: service_healthy }
    restart: unless-stopped

  celery_beat:
    image: langup-app
    container_name: langup-celery-beat
    env_file: [.env]
    entrypoint: ["uv", "run", "celery", "-A", "app.celery.config:celery_app", "beat", "--loglevel=info"]
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
